name: backend-challenge

x-application-environment: &application-environment
  HOST: 0.0.0.0
  PORT: '3000'
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_NAME: ${DB_NAME:-wagering}
  DB_USER: ${DB_USER:-wagering}
  DB_PASSWORD: ${DB_PASSWORD:-challenge-local-only}
  AWS_REGION: us-east-1
  SQS_ENDPOINT: http://localstack:4566

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${DB_NAME:-wagering}
      POSTGRES_USER: ${DB_USER:-wagering}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-challenge-local-only}
    ports:
      - '127.0.0.1:${DB_PORT:-15432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 3s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT_STRATEGY: dynamic
      DISABLE_EVENTS: '1'
      SKIP_INFRA_DOWNLOADS: '1'
    ports:
      - '127.0.0.1:4566:4566'
    healthcheck:
      test: ['CMD', 'awslocal', 'sqs', 'list-queues']
      interval: 5s
      timeout: 5s
      retries: 20

  queues:
    image: backend-challenge:local
    build:
      context: .
      target: runtime
    environment: *application-environment
    command: ['bun', 'dist/composition/provision-queues.js']
    depends_on:
      localstack:
        condition: service_healthy

  app:
    image: backend-challenge:local
    build:
      context: .
      target: runtime
    environment: *application-environment
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      queues:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const r=await fetch('http://127.0.0.1:3000/health/live');process.exit(r.ok?0:1)",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    stop_grace_period: 15s

  migrate:
    profiles: ['tools']
    image: backend-challenge:local
    build:
      context: .
      target: runtime
    environment: *application-environment
    command: ['bun', 'dist/composition/migrate.js', 'up']
    depends_on:
      postgres:
        condition: service_healthy

  persistence:
    profiles: ['tools']
    build:
      context: .
      target: build
    environment: *application-environment
    command: ['bun', 'run', 'test:persistence']
    depends_on:
      postgres:
        condition: service_healthy

  smoke:
    profiles: ['tools']
    build:
      context: .
      target: build
    environment:
      <<: *application-environment
      SMOKE_APP_URL: http://app:3000
    command: ['bun', 'run', 'test:smoke']
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
