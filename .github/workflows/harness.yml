name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun run stack:up
      - run: bun run stack:migrate
      - run: bun run stack:persistence
      - run: bun run stack:messaging
      - run: bun run stack:smoke
      - run: docker compose run --rm reference-worker bun dist/composition/reference-main.js --once
      - run: docker compose run --rm consumer bun dist/composition/messaging-main.js consumer --once
      - run: docker compose run --rm publisher bun dist/composition/messaging-main.js publisher --once
      - run: bun run stack:workers
      - name: Worker operational endpoints
        run: |
          for worker in consumer publisher reference-worker; do
            docker compose exec -T "$worker" bun -e "for(const path of ['health/ready','metrics']){const r=await fetch('http://127.0.0.1:9464/'+path);if(!r.ok)process.exit(1)}"
          done
      - name: Diagnostics on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail 100
      - name: Stop stack
        if: always()
        run: docker compose --profile workers down --volumes
